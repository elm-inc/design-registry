name: pages
# registry.json を shadcn build で public/r/*.json に変換し GitHub Pages に配信する。
# 案件側は components.json の @elm namespace からこの URL を参照する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build registry (shadcn)
        run: pnpm dlx shadcn@latest build
      - name: Sanity check output
        run: |
          test -f public/r/base.json
          node -e "JSON.parse(require('fs').readFileSync('public/r/base.json','utf8')); console.log('base.json OK')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
